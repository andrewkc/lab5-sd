services:
  app1:
    image: theandrewkc/champions-predictor:latest
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://champions:${POSTGRES_PASSWORD}@db:5432/champions
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: champions
      POSTGRES_USER: champions
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - champions_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champions -d champions"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  champions_data:
