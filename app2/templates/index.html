<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Studio</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell"><header><span class="eyebrow">Pregunta 2 · Marketing para empresas</span><h1>Marketing Studio</h1><p>Convierte una foto de producto en una campaña lista para publicar.</p></header>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<section class="panel"><h2>1. Recibe una foto</h2><p>Sube una imagen JPG, PNG o WEBP para comenzar.</p><form action="{{ url_for('marketing.create_campaign') }}" method="post" enctype="multipart/form-data"><input type="file" name="photo" accept="image/png,image/jpeg,image/webp" required><button>Analizar imagen</button></form></section></main></body></html>
