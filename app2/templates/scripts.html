<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guiones · Marketing Studio</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell"><header class="compact"><span class="eyebrow">Campaña #{{ campaign.id }}</span><h1>2. Escoge un guion</h1><p>Selecciona una propuesta para generar las piezas creativas.</p></header>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form action="{{ url_for('marketing.generate', campaign_id=campaign.id) }}" method="post"><div class="script-grid">{% for script in scripts %}<label class="script"><input type="radio" name="script_index" value="{{ loop.index0 }}" required><span><strong>{{ loop.index }} · {{ script.title }}</strong><b>{{ script.hook }}</b><small>{{ script.body }} {{ script.cta }}</small></span></label>{% endfor %}</div><div class="actions"><label>Red social<select name="platform" required><option value="instagram">Instagram</option><option value="tiktok">TikTok</option></select></label><button>Generar 3 fotos y 1 video</button></div></form></main></body></html>
